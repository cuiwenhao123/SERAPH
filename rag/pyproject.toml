[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seraph-rag"
version = "0.1.0"
description = "SERAPH Phase 2 RAG knowledge layer"
requires-python = ">=3.8"
dependencies = [
  "chromadb>=0.5",
  "posthog<4; python_version < '3.9'",
  "pysqlite3-binary>=0.5.3; python_version < '3.12'",
  "networkx>=3.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
embeddings = [
  "torch>=2.2",
  "transformers>=4.40",
]
test = [
  "pytest>=8",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
